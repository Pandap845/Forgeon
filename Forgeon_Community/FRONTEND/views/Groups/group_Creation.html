<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgeon — Create New Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/groups.css" />
  </head>
  <body class="dg-page dg-page--group-creation">
    <main class="dg-main gc-main">
      <header class="gc-header">
        <h1 class="gc-title">Create New Group</h1>
        <p class="gc-subtitle">Set up your community and invite members</p>
      </header>

      <form id="groupCreationForm" class="gc-form" action="#" method="post" novalidate>
        <section class="gc-card dg-surface-card" aria-labelledby="gcBasicHeading">
          <h2 id="gcBasicHeading" class="gc-section-title">Basic Information</h2>

          <div class="gs-field">
            <span class="gs-label">Cover Image</span>
            <label class="gc-upload-box" for="gcCoverInput">
              <span class="gc-upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 15V6m0 0-3 3m3-3 3 3M6 18h12" />
                </svg>
              </span>
              <span class="gc-upload-copy">Upload cover image</span>
              <span class="gc-upload-hint">Recommended: 1200×400px</span>
            </label>
            <input id="gcCoverInput" class="gs-file-input" type="file" accept="image/*" />
          </div>

          <div class="gs-field">
            <span class="gs-label">Group Icon</span>
            <div class="gc-icon-row">
              <label class="gc-icon-box" for="gcIconInput">
                <span class="gc-upload-icon gc-upload-icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M12 15V6m0 0-3 3m3-3 3 3M6 18h12" />
                  </svg>
                </span>
              </label>
              <div class="gc-icon-copy">
                <p class="gc-icon-copy__primary">Upload a group icon</p>
                <p class="gc-icon-copy__hint">Square image, at least 200×200px</p>
              </div>
            </div>
            <input id="gcIconInput" class="gs-file-input" type="file" accept="image/*" />
          </div>

          <div class="gs-divider" aria-hidden="true"></div>

          <div class="gs-field gs-field--compact">
            <label class="gs-label" for="gcGroupName">Group Name <span class="gs-req">*</span></label>
            <input
              id="gcGroupName"
              name="name"
              class="gs-input"
              type="text"
              placeholder="Enter group name"
              required
              autocomplete="off"
            />
          </div>

          <div class="gs-field gs-field--compact">
            <label class="gs-label" for="gcGroupDesc">Description <span class="gs-req">*</span></label>
            <textarea
              id="gcGroupDesc"
              name="description"
              class="gs-textarea gc-textarea"
              rows="5"
              placeholder="Describe what your group is about..."
              required
            ></textarea>
            <p id="gcCharCount" class="gs-hint gs-hint--count" aria-live="polite">0 characters</p>
          </div>
        </section>

        <section class="gc-card dg-surface-card" aria-labelledby="gcInviteHeading">
          <h2 id="gcInviteHeading" class="gc-section-title">Invite Members (Optional)</h2>
          <p class="gc-invite-lead">Invite users to join your group right away</p>
          <a href="./group_invitations.html" class="gc-invite-btn">
            <span class="gc-invite-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="10" cy="8" r="3"></circle>
                <path d="M4.5 17a5.5 5.5 0 0 1 11 0M18 8v4M16 10h4"></path>
              </svg>
            </span>
            Search and Invite Users
          </a>
        </section>

        <div class="gc-actions">
          <a href="./group_management.html" class="gc-btn gc-btn--cancel">Cancel</a>
          <button id="gcCreateBtn" type="submit" class="gc-btn gc-btn--create" disabled>Create Group</button>
        </div>
      </form>
    </main>

    <script src="./scripts/group_creation.js"></script>
  </body>
</html>
