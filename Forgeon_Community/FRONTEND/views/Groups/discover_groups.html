<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <title>Forgeon — Discover Groups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/styles/groups.css" />
    <link rel="stylesheet" href="../../assets/styles/avatar-frames.css" />
    <link rel="stylesheet" href="../../assets/styles/header.css" />
  </head>
  <body class="dg-page">
    <header class="forgeon-navbar">
      <nav class="navbar navbar-expand-lg py-3">
        <div class="container-fluid px-4">
          <a class="navbar-brand d-flex align-items-center gap-3" href="../Home/homepage.html" title="Home">
            <span class="forgeon-brand-badge d-inline-flex align-items-center justify-content-center">
              <img src="https://cdn-icons-png.flaticon.com/512/686/686589.png" alt="logo" class="logo-img" />
            </span>
            <span class="d-flex flex-column lh-sm">
              <span class="fw-medium">Forgeon</span>
              <small class="text-muted-2">Gaming Community</small>
            </span>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#forgeonNav"
            aria-controls="forgeonNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="forgeonNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-3">
                <li class="nav-item">
                <a class="nav-link text-muted-2" href="../Home/forums.html">Forums</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-muted-2" href="./user_groups.html">Groups</a>
              </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
              <a class="btn btn-link text-muted-2 px-2" href="./search.html" aria-label="Search">
                <i class="bi bi-search fs-5"></i>
              </a>
              <button
                class="btn btn-link text-muted-2 px-2"
                type="button"
                aria-label="Notifications"
                data-bs-toggle="modal"
                data-bs-target="#notificationsModal"
              >
                <i class="bi bi-bell fs-5"></i>
              </button>
              <a class="btn btn-link text-muted-2 px-2" href="../Groups/friend_requests.html" aria-label="Friend Requests">
                <i class="bi bi-people fs-5"></i>
              </a>
              <a class="btn btn-link text-muted-2 px-2 nav-logout-btn" href="../Login_Register/login.html" aria-label="Log out" title="Log out">
                <i class="bi bi-box-arrow-right fs-5"></i>
              </a>
              <a
                class="btn btn-link text-muted-2 px-2 d-inline-flex align-items-center justify-content-center nav-profile-avatar"
                href="../Profile/profile.html"
                aria-label="Profile"
              >
                <img
                  class="nav-profile-img"
                  src="https://i.pinimg.com/736x/b1/21/18/b1211897266308c27112a58eacad7482.jpg"
                  alt=""
                  width="36"
                  height="36"
                />
              </a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="dg-main">
      <header class="dg-header">
        <h1 class="dg-title">Discover Groups</h1>
        <p class="dg-subtitle">Find and join communities that match your interests</p>
      </header>

      <section class="dg-toolbar" aria-label="Search and filters">
        <div class="dg-search-wrap">
          <span class="dg-search-icon" aria-hidden="true">
            <img src="https://www.figma.com/api/mcp/asset/7fbe92ab-1622-4606-8b96-16a3263926e6" alt="" width="20" height="20" />
          </span>
          <input
            id="groupSearch"
            class="dg-search-input"
            type="search"
            placeholder="Search groups by name..."
            autocomplete="off"
          />
        </div>

        <div class="dg-toolbar-row">
          <div class="dg-sort">
            <label class="dg-sort-label" for="sortSelect">Sort by:</label>
            <div class="dg-sort-control">
              <span class="dg-sort-icon" aria-hidden="true">
                <img src="https://www.figma.com/api/mcp/asset/8a7c50c3-6063-4bc2-bf3d-3b88dfbb48c0" alt="" width="16" height="16" />
              </span>
              <select id="sortSelect" class="dg-select" aria-label="Sort groups">
                <option value="members" selected>Most Members</option>
                <option value="newest">Newest</option>
              </select>
              <span class="dg-select-chevron" aria-hidden="true">
                <img src="https://www.figma.com/api/mcp/asset/0410da67-41e5-4bcd-8895-af38439ebee3" alt="" width="16" height="16" />
              </span>
            </div>
          </div>

          <div class="dg-view-toggle" role="group" aria-label="Layout">
            <button type="button" id="btnGridView" class="dg-view-btn dg-view-btn--active" aria-pressed="true" title="Grid view">
              <img src="https://www.figma.com/api/mcp/asset/1ef5e593-6380-439a-bdb1-eb5c085364e6" alt="" width="16" height="16" />
            </button>
            <button type="button" id="btnListView" class="dg-view-btn" aria-pressed="false" title="List view">
              <img src="https://www.figma.com/api/mcp/asset/030df371-14bf-479d-a5b0-31e1eeb999f1" alt="" width="16" height="16" />
            </button>
          </div>
          <a class="dg-btn dg-btn--ghost dg-btn--search-page" href="./search.html">Advanced Search</a>
        </div>

        <p id="groupCount" class="dg-count">Showing 12 of 12 groups</p>
      </section>

      <section class="dg-groups" aria-label="Groups">
        <div id="groupsGrid" class="dg-cards dg-cards--grid"></div>
      </section>
    </main>

    <div class="modal fade" id="notificationsModal" tabindex="-1" aria-labelledby="notificationsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content forgeon-modal">
          <div class="modal-body p-4">
            <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
              <div>
                <h2 class="h5 mb-1" id="notificationsModalLabel">Notifications</h2>
                <div class="text-muted-2 small">Your latest activity</div>
              </div>
              <button type="button" class="btn btn-link text-muted-2 p-0" data-bs-dismiss="modal" aria-label="Close">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>

            <div class="forgeon-card p-3">
              <div class="d-flex gap-3">
                <div class="tv-notif-dot" aria-hidden="true">
                  <i class="bi bi-bell"></i>
                </div>
                <div class="flex-grow-1">
                  <div class="fw-medium">Placeholder notification</div>
                  <div class="text-muted-2 small">
                    Someone replied to your thread <span class="text-white-50">“Switch limits”</span>.
                  </div>
                  <div class="text-muted-3 small mt-2">Just now</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/scripts/avatar-frames.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../../controllers/groups_controller.js"></script>
    <script src="../../controllers/group_memberships_controller.js"></script>
    <script src="../../assets/scripts/groups.js"></script>
    <script src="../../controllers/friends_invitations_controller.js"></script>
    <script src="../../controllers/groups_invitations_controller.js"></script>
    <script src="../../controllers/notification.controller.js"></script>
    <script src="../../assets/scripts/loading-overlay.js"></script>
    <script src="../../assets/scripts/notifications.js"></script>
    <script src="../../assets/scripts/nav-logout.js"></script>
  </body>
</html>
